<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - DevPortfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container"><a class="navbar-brand fw-bold" href="index.html">DevPortfolio</a></div>
    </nav>

    <div class="container py-5">
        <h1 class="mb-5 fw-bold">Latest Articles</h1>
        <div class="row">
            <div class="col-lg-8">
                <!-- Blog Cards (Rút gọn để tập trung vào Comment) -->
                <div class="card border-0 shadow-sm mb-5">
                    <div class="card-body p-4">
                        <span class="badge bg-primary mb-2">JavaScript</span>
                        <h3 class="card-title fw-bold">The Future of JavaScript</h3>
                        <p class="card-text text-muted">Explore the latest features and improvements coming to JavaScript...</p>
                    </div>
                </div>

                <!-- NEW: Comment Section - Form -->
                <section id="comments" class="bg-white p-4 rounded-3 shadow-sm mt-5">
                    <h3 class="fw-bold mb-4">Leave a Comment</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="john@example.com" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Message</label>
                                <textarea class="form-control" rows="4" placeholder="Your thoughts..." required></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary px-4">Post Comment</button>
                            </div>
                        </div>
                    </form>
                    
                    <!-- Danh sách Comment sẽ nằm ở đây -->
                    <div id="comment-list-area" class="mt-5"></div>
                </section>
            </div>

            <!-- Sidebar -->
            <div class="col-lg-4">
                <div class="sticky-top" style="top: 20px;">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body"><h5 class="fw-bold mb-3">Categories</h5></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
