<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - DevPortfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container"><a class="navbar-brand fw-bold" href="index.html">DevPortfolio</a></div>
    </nav>

    <div class="container py-5">
        <h1 class="mb-5 fw-bold">Latest Articles</h1>
        <div class="row">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm mb-5">
                    <div class="card-body p-4"><h3 class="card-title fw-bold">The Future of JavaScript</h3></div>
                </div>

                <section id="comments" class="bg-white p-4 rounded-3 shadow-sm mt-5">
                    <h3 class="fw-bold mb-4">Leave a Comment</h3>
                    <form class="mb-5">
                        <!-- Rút gọn form để dễ nhìn -->
                        <div class="row g-3"><div class="col-12"><textarea class="form-control" rows="3" placeholder="Your thoughts..."></textarea></div></div>
                    </form>
                    
                    <!-- NEW: Threaded Comments List -->
                    <h4 class="fw-bold mb-4">Comments (2)</h4>
                    <div class="comments-list">
                        <!-- Parent Comment -->
                        <div class="d-flex mb-4">
                            <img src="https://picsum.photos/50/50?random=1" class="rounded-circle me-3" width="50" height="50" alt="Avatar">
                            <div>
                                <h6 class="fw-bold mb-1">Sarah Johnson <small class="text-muted fw-normal ms-2">2 hours ago</small></h6>
                                <p class="mb-2">This is exactly what I was looking for. The explanation about ES2024 is very clear!</p>
                                <button class="btn btn-sm btn-outline-secondary">Reply</button>
                            </div>
                        </div>

                        <!-- Child Comment (Nested / Threaded) -->
                        <div class="d-flex mb-4 ms-5 bg-light p-3 rounded-3">
                            <img src="https://picsum.photos/50/50?random=2" class="rounded-circle me-3" width="40" height="40" alt="Avatar">
                            <div>
                                <h6 class="fw-bold mb-1">Author <span class="badge bg-primary ms-1">Admin</span></h6>
                                <p class="mb-0">Thank you, Sarah! Glad you found it helpful.</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Sidebar -->
            <div class="col-lg-4">
                <div class="sticky-top" style="top: 20px;">
                    <div class="card border-0 shadow-sm mb-4"><div class="card-body"><h5 class="fw-bold mb-3">Categories</h5></div></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
